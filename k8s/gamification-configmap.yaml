apiVersion: v1
kind: ConfigMap
metadata:
  name: priorix-gamification-config
  namespace: priorix
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://priorix.local
  LOG_CHANNEL: stack
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql-gamification
  DB_PORT: "3306"
  DB_DATABASE: priorix_gamification
  DB_USERNAME: priorix
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"
  JWT_TTL: "15"
  JWT_BLACKLIST_ENABLED: "false"
  JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
  PROMETHEUS_STORAGE_ADAPTER: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  PROMETHEUS_PREFIX: priorix_gamification
  PROMETHEUS_REDIS_DB: "2"
