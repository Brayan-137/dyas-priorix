apiVersion: v1
kind: ConfigMap
metadata:
  name: priorix-core-config
  namespace: priorix
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://priorix.local
  LOG_CHANNEL: stack
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: mysql-core
  DB_PORT: "3306"
  DB_DATABASE: priorix_core
  DB_USERNAME: priorix
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "null"
  JWT_TTL: "1"
  JWT_REFRESH_TTL: "10080"
  JWT_BLACKLIST_ENABLED: "true"
  JWT_BLACKLIST_GRACE_PERIOD: "10"
  GAMIFICATION_SERVICE_URL: http://gamification/api/gamification
  STATISTICS_SERVICE_URL: http://gamification/api/statistics
  JAEGER_ENDPOINT: http://jaeger:4318/v1/traces
  PROMETHEUS_STORAGE_ADAPTER: redis
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  JWT_ALGO: HS256
  PROMETHEUS_PREFIX: priorix_core
  PROMETHEUS_REDIS_DB: "1"
