apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-core-pvc
  namespace: priorix
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-core
  namespace: priorix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-core
  template:
    metadata:
      labels:
        app: mysql-core
    spec:
      containers:
        - name: mysql-core
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: priorix-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: priorix_core
            - name: MYSQL_USER
              value: priorix
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: priorix-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-core-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-core-data
          persistentVolumeClaim:
            claimName: mysql-core-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-core
  namespace: priorix
spec:
  selector:
    app: mysql-core
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
