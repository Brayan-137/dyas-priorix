stages:
  - sast
  - secrets
  - dependency-scan
  - container-scan
  - quality

# ─── SAST ───────────────────────────────────────────────────────────────────

semgrep-sast:
  stage: sast
  image: semgrep/semgrep
  script:
    - semgrep --config=p/php
      --config=p/owasp-top-ten
      --config=p/security-audit
      priorix-core/app priorix-gamification/app
      --json --output=semgrep-report.json
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    reports:
      sast: semgrep-report.json
  allow_failure: true

# ─── SECRETS ────────────────────────────────────────────────────────────────

gitleaks-secrets:
  stage: secrets
  image:
    name: zricethezav/gitleaks
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --report-format=json
      --report-path=gitleaks-report.json --verbose
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
  allow_failure: true

# ─── DEPENDENCY SCAN ────────────────────────────────────────────────────────

dependency-check-core:
  stage: dependency-scan
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
    - unzip dependency-check-9.0.9-release.zip
  script:
    - ./dependency-check/bin/dependency-check.sh
      --project "priorix-core"
      --scan priorix-core/composer.lock
      --format HTML --format JSON
      --out dependency-report-core
      --disableAssembly
      --disableNodeJS
  artifacts:
    when: always
    paths:
      - dependency-report-core/
  allow_failure: true

dependency-check-gamification:
  stage: dependency-scan
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
    - unzip dependency-check-9.0.9-release.zip
  script:
    - ./dependency-check/bin/dependency-check.sh
      --project "priorix-gamification"
      --scan priorix-gamification/composer.lock
      --format HTML --format JSON
      --out dependency-report-gamification
      --disableAssembly
      --disableNodeJS
  artifacts:
    when: always
    paths:
      - dependency-report-gamification/
  allow_failure: true

# ─── CONTAINER SCAN ─────────────────────────────────────────────────────────

trivy-core:
  stage: container-scan
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t priorix-core:scan priorix-core/
    - trivy image --exit-code 0 --format json
      --output trivy-report-core.json
      --severity HIGH,CRITICAL
      priorix-core:scan
  artifacts:
    when: always
    paths:
      - trivy-report-core.json
  allow_failure: true

trivy-gamification:
  stage: container-scan
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t priorix-gamification:scan priorix-gamification/
    - trivy image --exit-code 0 --format json
      --output trivy-report-gamification.json
      --severity HIGH,CRITICAL
      priorix-gamification:scan
  artifacts:
    when: always
    paths:
      - trivy-report-gamification.json
  allow_failure: true

# ─── QUALITY ────────────────────────────────────────────────────────────────

sonarcloud-core:
  stage: quality
  image: sonarsource/sonar-scanner-cli
  variables:
    SONAR_HOST_URL: "https://sonarcloud.io"
    SONAR_TOKEN: $SONAR_TOKEN
  script:
    - cd priorix-core
    - sonar-scanner
  only:
    - main
    - develop
    - brayan
  allow_failure: true

sonarcloud-gamification:
  stage: quality
  image: sonarsource/sonar-scanner-cli
  variables:
    SONAR_HOST_URL: "https://sonarcloud.io"
    SONAR_TOKEN: $SONAR_TOKEN
  script:
    - cd priorix-gamification
    - sonar-scanner
  only:
    - main
    - develop
  allow_failure: true
