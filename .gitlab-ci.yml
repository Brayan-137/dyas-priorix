# Pipeline GitLab CI/CD — equivalente a .github/workflows/ci.yml (CI + CD)
# CI: tests + build Docker | CD: push al Container Registry + validación/despliegue K8s

stages:
  - test
  - build
  - deploy
  # Etapas de seguridad (SAST, secrets, dependency scan, container scan) y calidad (SonarCloud)
  - sast
  - secrets
  - dependency-scan
  - container-scan
  - test
  - quality

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

variables:
  COMPOSER_ALLOW_SUPERUSER: 1
  OVERLAY_STAGING: kubernetes/overlays/staging
  OVERLAY_PRODUCTION: kubernetes/overlays/production

.default_php: &default_php
  image: php:8.3
  before_script:
    - apt-get update -y
    - apt-get install -y unzip git curl libzip-dev libpng-dev libonig-dev libxml2-dev zip
    - docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd zip
    - pecl install redis
    - docker-php-ext-enable redis
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer
  cache:
    key: "${CI_PROJECT_NAME}-${CI_JOB_NAME}"
    paths:
      - vendor/

.docker_dind: &docker_dind
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""

# --- CI: pruebas (igual que GitHub Actions) ---

core-tests:
  <<: *default_php
  stage: test
  services:
    - name: redis:alpine
      alias: redis
  variables:
    REDIS_HOST: redis
  script:
    - cd priorix-core
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - cp .env.example .env
    - php artisan key:generate --ansi
    - php -r "file_put_contents('.env', preg_replace('/^REDIS_HOST=.*/m', 'REDIS_HOST=redis', file_get_contents('.env')));"
    - composer test

gamification-tests:
  <<: *default_php
  stage: test
  services:
    - name: redis:alpine
      alias: redis
  variables:
    REDIS_HOST: redis
  script:
    - cd priorix-gamification
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - cp .env.example .env
    - php artisan key:generate --ansi
    - php -r "file_put_contents('.env', preg_replace('/^REDIS_HOST=.*/m', 'REDIS_HOST=redis', file_get_contents('.env')));"
    - composer test

frontend-tests:
  image: node:22
  stage: test
  cache:
    key: "${CI_PROJECT_NAME}-${CI_JOB_NAME}"
    paths:
      - client/node_modules/
  script:
    - cd client
    - npm ci
    - npm run test

docker-build:
  <<: *docker_dind
  stage: build
  needs: [core-tests, gamification-tests, frontend-tests]
  script:
    - docker info
    - docker build -t priorix-core:ci priorix-core
    - docker build -t priorix-gamification:ci priorix-gamification

# --- CD: solo en push a main/master (equivalente al job "Despliegue continuo" en GitHub) ---

deploy-staging:
  <<: *docker_dind
  stage: deploy
  needs: [docker-build]
  environment:
    name: staging
  rules:
    - if: ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master") && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache curl
    - |
      KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
      curl -sLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      echo "Publicando imágenes en ${CI_REGISTRY}"
      docker build -t "${CI_REGISTRY_IMAGE}/priorix-core:${CI_COMMIT_SHA}" \
        -t "${CI_REGISTRY_IMAGE}/priorix-core:latest" priorix-core
      docker build -t "${CI_REGISTRY_IMAGE}/priorix-gamification:${CI_COMMIT_SHA}" \
        -t "${CI_REGISTRY_IMAGE}/priorix-gamification:latest" priorix-gamification
      docker push "${CI_REGISTRY_IMAGE}/priorix-core:${CI_COMMIT_SHA}"
      docker push "${CI_REGISTRY_IMAGE}/priorix-core:latest"
      docker push "${CI_REGISTRY_IMAGE}/priorix-gamification:${CI_COMMIT_SHA}"
      docker push "${CI_REGISTRY_IMAGE}/priorix-gamification:latest"
    - |
      if [ -z "$KUBE_CONFIG" ]; then
        echo "KUBE_CONFIG no configurado: validando manifiestos con kustomize (${OVERLAY_STAGING})."
        kubectl kustomize "$OVERLAY_STAGING" > /dev/null
        echo "Manifiestos Kubernetes OK (kustomize build exitoso)."
      else
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
        kubectl apply -k "$OVERLAY_STAGING"
        kubectl rollout status deployment/priorix-core -n priorix --timeout=180s
        kubectl rollout status deployment/priorix-gamification -n priorix --timeout=180s
      fi

deploy-production:
  <<: *docker_dind
  stage: deploy
  needs: [docker-build]
  environment:
    name: production
  when: manual
  rules:
    - if: ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master") && $CI_PIPELINE_SOURCE == "push"
      when: manual
    - when: never
  before_script:
    - apk add --no-cache curl
    - |
      KUBECTL_VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt)
      curl -sLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      docker build -t "${CI_REGISTRY_IMAGE}/priorix-core:${CI_COMMIT_SHA}" \
        -t "${CI_REGISTRY_IMAGE}/priorix-core:latest" priorix-core
      docker build -t "${CI_REGISTRY_IMAGE}/priorix-gamification:${CI_COMMIT_SHA}" \
        -t "${CI_REGISTRY_IMAGE}/priorix-gamification:latest" priorix-gamification
      docker push "${CI_REGISTRY_IMAGE}/priorix-core:${CI_COMMIT_SHA}"
      docker push "${CI_REGISTRY_IMAGE}/priorix-core:latest"
      docker push "${CI_REGISTRY_IMAGE}/priorix-gamification:${CI_COMMIT_SHA}"
      docker push "${CI_REGISTRY_IMAGE}/priorix-gamification:latest"
    - |
      if [ -z "$KUBE_CONFIG" ]; then
        echo "KUBE_CONFIG no configurado: validando manifiestos con kustomize (${OVERLAY_PRODUCTION})."
        kubectl kustomize "$OVERLAY_PRODUCTION" > /dev/null
        echo "Manifiestos Kubernetes OK (kustomize build exitoso)."
      else
        mkdir -p ~/.kube
        echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
        kubectl apply -k "$OVERLAY_PRODUCTION"
        kubectl rollout status deployment/priorix-core -n priorix --timeout=180s
        kubectl rollout status deployment/priorix-gamification -n priorix --timeout=180s
      fi

# ─── SAST ───────────────────────────────────────────────────────────────────

semgrep-sast:
  stage: sast
  image: semgrep/semgrep
  script:
    - semgrep --config=p/php
      --config=p/owasp-top-ten
      --config=p/security-audit
      priorix-core/app priorix-gamification/app
      --json --output=semgrep-report.json
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    reports:
      sast: semgrep-report.json
  allow_failure: true

# ─── SECRETS ────────────────────────────────────────────────────────────────

gitleaks-secrets:
  stage: secrets
  image:
    name: zricethezav/gitleaks
    entrypoint: [""]
  script:
    - gitleaks detect --source=. --report-format=json
      --report-path=gitleaks-report.json --verbose
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
  allow_failure: true

# ─── DEPENDENCY SCAN ────────────────────────────────────────────────────────

snyk-core:
  stage: dependency-scan
  image: node:18
  before_script:
    - npm install -g snyk
  script:
    - cd priorix-core
    - snyk auth $SNYK_TOKEN
    - snyk test --file=composer.lock
      --package-manager=composer
      --json > ../dependency-report-core.json || true
  artifacts:
    when: always
    paths:
      - dependency-report-core.json
  allow_failure: true

snyk-gamification:
  stage: dependency-scan
  image: node:18
  before_script:
    - npm install -g snyk
  script:
    - cd priorix-gamification
    - snyk auth $SNYK_TOKEN
    - snyk test --file=composer.lock
      --package-manager=composer
      --json > ../dependency-report-gamification.json || true
  artifacts:
    when: always
    paths:
      - dependency-report-gamification.json
  allow_failure: true

# ─── CONTAINER SCAN ─────────────────────────────────────────────────────────

trivy-core:
  stage: container-scan
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t priorix-core:scan priorix-core/
    - trivy image --exit-code 0 --format json
      --output trivy-report-core.json
      --severity HIGH,CRITICAL
      priorix-core:scan
  artifacts:
    when: always
    paths:
      - trivy-report-core.json
  allow_failure: true

trivy-gamification:
  stage: container-scan
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker build -t priorix-gamification:scan priorix-gamification/
    - trivy image --exit-code 0 --format json
      --output trivy-report-gamification.json
      --severity HIGH,CRITICAL
      priorix-gamification:scan
  artifacts:
    when: always
    paths:
      - trivy-report-gamification.json
  allow_failure: true

# ─── TESTS ─────────────────────────────────────────────────────────────────────

test-core:
  stage: test
  image: ghcr.io/shivammathur/php:8.2
  before_script:
    - cd priorix-core
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - php artisan key:generate --ansi
    - php -r "file_put_contents('.env', preg_replace('/^REDIS_HOST=.*/m', 'REDIS_HOST=redis', file_get_contents('.env')));"
  script:
    - cd priorix-core
    - php artisan test --coverage-clover coverage.xml
  artifacts:
    when: always
    paths:
      - priorix-core/coverage.xml
  allow_failure: true

test-gamification:
  stage: test
  image: ghcr.io/shivammathur/php:8.2
  before_script:
    - cd priorix-gamification
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - php artisan key:generate --ansi
  script:
    - cd priorix-gamification
    - php artisan test --coverage-clover coverage.xml
  artifacts:
    when: always
    paths:
      - priorix-gamification/coverage.xml
  allow_failure: true

# ─── QUALITY ────────────────────────────────────────────────────────────────

sonarcloud-core:
  stage: quality
  image: sonarsource/sonar-scanner-cli
  variables:
    SONAR_HOST_URL: "https://sonarcloud.io"
  script:
    - cd priorix-core
    - sonar-scanner -Dsonar.token=$SONAR_TOKEN
  only:
    - main
    - develop
  allow_failure: true

sonarcloud-gamification:
  stage: quality
  image: sonarsource/sonar-scanner-cli
  variables:
    SONAR_HOST_URL: "https://sonarcloud.io"
  script:
    - cd priorix-gamification
    - sonar-scanner -Dsonar.token=$SONAR_TOKEN
  only:
    - main
    - develop
  allow_failure: true
