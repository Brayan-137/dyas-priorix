apiVersion: v1
kind: Service
metadata:
  name: mysql-gamification
spec:
  ports:
    - port: 3306
  selector:
    app: mysql-gamification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-gamification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-gamification
  template:
    metadata:
      labels:
        app: mysql-gamification
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: priorix-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: priorix_gamification
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: priorix-config
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: priorix-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 3306
