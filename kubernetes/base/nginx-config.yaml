apiVersion: v1
kind: ConfigMap
metadata:
  name: priorix-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        location / {
            proxy_pass http://priorix-core:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {
        listen 81;
        location / {
            proxy_pass http://priorix-gamification:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
