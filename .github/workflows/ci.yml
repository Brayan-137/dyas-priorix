name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  core-tests:
    name: Pruebas Priorix Core
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, curl, dom, gd, pdo_mysql, zip, redis
          tools: composer
          coverage: none

      - name: Instalar dependencias de Composer
        working-directory: priorix-core
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Preparar entorno de prueba
        working-directory: priorix-core
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php -r "file_put_contents('.env', preg_replace('/^REDIS_HOST=.*/m', 'REDIS_HOST=127.0.0.1', file_get_contents('.env')));"

      - name: Ejecutar tests
        working-directory: priorix-core
        env:
          REDIS_HOST: 127.0.0.1
        run: composer test

  gamification-tests:
    name: Pruebas Priorix Gamification
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, curl, dom, gd, pdo_mysql, zip, redis
          tools: composer
          coverage: none

      - name: Instalar dependencias de Composer
        working-directory: priorix-gamification
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Preparar entorno de prueba
        working-directory: priorix-gamification
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php -r "file_put_contents('.env', preg_replace('/^REDIS_HOST=.*/m', 'REDIS_HOST=127.0.0.1', file_get_contents('.env')));"

      - name: Ejecutar tests
        working-directory: priorix-gamification
        env:
          REDIS_HOST: 127.0.0.1
        run: composer test

  frontend-tests:
    name: Pruebas Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: client
        run: npm ci

      - name: Ejecutar tests frontend
        working-directory: client
        run: npm run test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [core-tests, gamification-tests, frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Priorix Core image
        uses: docker/build-push-action@v5
        with:
          context: priorix-core
          file: priorix-core/Dockerfile
          push: false
          tags: priorix-core:ci

      - name: Build Priorix Gamification image
        uses: docker/build-push-action@v5
        with:
          context: priorix-gamification
          file: priorix-gamification/Dockerfile
          push: false
          tags: priorix-gamification:ci

  deploy:
    name: Despliegue continuo
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nombre de imágenes (minúsculas)
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_CORE=ghcr.io/${REPO_LC}/priorix-core" >> "$GITHUB_ENV"
          echo "IMAGE_GAMIFICATION=ghcr.io/${REPO_LC}/priorix-gamification" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y publicar priorix-core
        uses: docker/build-push-action@v5
        with:
          context: priorix-core
          file: priorix-core/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_CORE }}:latest
            ${{ env.IMAGE_CORE }}:${{ github.sha }}

      - name: Build y publicar priorix-gamification
        uses: docker/build-push-action@v5
        with:
          context: priorix-gamification
          file: priorix-gamification/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_GAMIFICATION }}:latest
            ${{ env.IMAGE_GAMIFICATION }}:${{ github.sha }}

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4

      - name: Validar manifiestos Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          OVERLAY="kubernetes/overlays/staging"
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG no configurado: validando manifiestos con kustomize (sin clúster)."
            kubectl kustomize "$OVERLAY" > /dev/null
            echo "Manifiestos Kubernetes OK (kustomize build exitoso)."
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl apply -k "$OVERLAY"
          kubectl rollout status deployment/priorix-core -n priorix --timeout=180s
          kubectl rollout status deployment/priorix-gamification -n priorix --timeout=180s
