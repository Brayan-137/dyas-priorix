name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  core-tests:
    name: Pruebas Priorix Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, curl, dom, gd, pdo_mysql, zip, redis
          tools: composer
          coverage: none

      - name: Instalar dependencias de Composer
        working-directory: priorix-core
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Preparar entorno de prueba
        working-directory: priorix-core
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Ejecutar tests
        working-directory: priorix-core
        run: composer test

  gamification-tests:
    name: Pruebas Priorix Gamification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, bcmath, curl, dom, gd, pdo_mysql, zip, redis
          tools: composer
          coverage: none

      - name: Instalar dependencias de Composer
        working-directory: priorix-gamification
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Preparar entorno de prueba
        working-directory: priorix-gamification
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Ejecutar tests
        working-directory: priorix-gamification
        run: composer test

  frontend-tests:
    name: Pruebas Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: client
        run: npm ci

      - name: Ejecutar tests frontend
        working-directory: client
        run: npm run test

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [core-tests, gamification-tests, frontend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Priorix Core image
        uses: docker/build-push-action@v5
        with:
          context: priorix-core
          file: priorix-core/Dockerfile
          push: false
          tags: priorix-core:ci

      - name: Build Priorix Gamification image
        uses: docker/build-push-action@v5
        with:
          context: priorix-gamification
          file: priorix-gamification/Dockerfile
          push: false
          tags: priorix-gamification:ci
