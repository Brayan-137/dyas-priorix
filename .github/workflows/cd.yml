name: CD

# Despliegue manual. El despliegue automático tras CI exitoso corre en el job
# "Despliegue continuo" del workflow CI (mismo push a main).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de despliegue
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Despliegue continuo (manual)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalizar nombre de imágenes (minúsculas)
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_CORE=ghcr.io/${REPO_LC}/priorix-core" >> "$GITHUB_ENV"
          echo "IMAGE_GAMIFICATION=ghcr.io/${REPO_LC}/priorix-gamification" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV=${{ inputs.environment }}" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y publicar priorix-core
        uses: docker/build-push-action@v5
        with:
          context: priorix-core
          file: priorix-core/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_CORE }}:latest
            ${{ env.IMAGE_CORE }}:${{ github.sha }}

      - name: Build y publicar priorix-gamification
        uses: docker/build-push-action@v5
        with:
          context: priorix-gamification
          file: priorix-gamification/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_GAMIFICATION }}:latest
            ${{ env.IMAGE_GAMIFICATION }}:${{ github.sha }}

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v4

      - name: Desplegar en Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          OVERLAY="kubernetes/overlays/${DEPLOY_ENV}"
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG no configurado: validando manifiestos con dry-run ($OVERLAY)."
            kubectl apply --dry-run=client -k "$OVERLAY"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl apply -k "$OVERLAY"
          kubectl rollout status deployment/priorix-core -n priorix --timeout=180s
          kubectl rollout status deployment/priorix-gamification -n priorix --timeout=180s
