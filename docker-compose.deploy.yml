version: '3.9'

services:
  core:
    image: ghcr.io/${GHCR_OWNER}/priorix-core:${CORE_IMAGE_TAG:-latest}
    networks:
      - priorix-network
    depends_on:
      - mysql-core
      - redis
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${CORE_APP_URL:-http://localhost:8000}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: mysql-core
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${CORE_DB_DATABASE:-priorix_core}
      DB_USERNAME: ${DB_USERNAME:-priorix}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      JWT_TTL: ${JWT_TTL:-1}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-10080}
      JWT_BLACKLIST_ENABLED: ${JWT_BLACKLIST_ENABLED:-true}
      JWT_BLACKLIST_GRACE_PERIOD: ${JWT_BLACKLIST_GRACE_PERIOD:-10}
      JWT_SECRET: ${JWT_SECRET}
      GAMIFICATION_SERVICE_URL: ${GAMIFICATION_SERVICE_URL:-http://gamification/api/gamification}
      STATISTICS_SERVICE_URL: ${STATISTICS_SERVICE_URL:-http://gamification/api/statistics}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
      PROMETHEUS_STORAGE_ADAPTER: ${PROMETHEUS_STORAGE_ADAPTER:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-array}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      JWT_ALGO: ${JWT_ALGO:-HS256}
      PROMETHEUS_PREFIX: ${CORE_PROMETHEUS_PREFIX:-priorix_core}
      PROMETHEUS_REDIS_DB: ${CORE_PROMETHEUS_REDIS_DB:-1}

  gamification:
    image: ghcr.io/${GHCR_OWNER}/priorix-gamification:${GAMIFICATION_IMAGE_TAG:-latest}
    networks:
      - priorix-network
    depends_on:
      - mysql-gamification
      - redis
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${GAMIFICATION_APP_URL:-http://localhost:8001}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: mysql-gamification
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${GAMIFICATION_DB_DATABASE:-priorix_gamification}
      DB_USERNAME: ${DB_USERNAME:-priorix}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      JWT_TTL: ${JWT_TTL:-15}
      JWT_BLACKLIST_ENABLED: ${JWT_BLACKLIST_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:4318/v1/traces}
      PROMETHEUS_STORAGE_ADAPTER: ${PROMETHEUS_STORAGE_ADAPTER:-redis}
      CACHE_STORE: ${CACHE_STORE:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      PROMETHEUS_PREFIX: ${GAMIFICATION_PROMETHEUS_PREFIX:-priorix_gamification}
      PROMETHEUS_REDIS_DB: ${GAMIFICATION_REDIS_DB:-2}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "81:81"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - core
      - gamification
    networks:
      - priorix-network

  mysql-core:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${CORE_DB_DATABASE:-priorix_core}
      MYSQL_USER: ${DB_USERNAME:-priorix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-core-data:/var/lib/mysql
    networks:
      - priorix-network

  mysql-gamification:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${GAMIFICATION_DB_DATABASE:-priorix_gamification}
      MYSQL_USER: ${DB_USERNAME:-priorix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-gamification-data:/var/lib/mysql
    networks:
      - priorix-network

  redis:
    image: redis:alpine
    networks:
      - priorix-network

networks:
  priorix-network:
    driver: bridge

volumes:
  mysql-core-data:
  mysql-gamification-data:
